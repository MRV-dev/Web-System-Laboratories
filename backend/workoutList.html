<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Document</title>
    <link rel="stylesheet" href="workout.css">
</head>
<body>
    
    <div class="container">
        <div class="row add-search g-4">
            <div class="search col" id="workout-list">
                <h2 class="header-title">Workout list</h2>
                <ul class="unlist">
                    
                </ul>

            </div>
            


            <div class="add col" id="adding-workout">
                <h2 class="header-workout">Add Workout</h2>

                <div class="addWorkout">
                    <label for="workout">Workout:</label>
                    <form id="add-workout">
                        <input type="text" id="workouts" name="workout" placeholder="workout">
                    </form>
                </div>
                
                <div class="addReps">
                    <label for="reps">Reps:</label>
                    <form id="add-reps">
                        <input type="text" id="reps" name="reps" placeholder="reps">
                    </form>
                </div>

                <div class="addLoads">
                    <label for="loads">Loads:</label>
                    <form id="add-loads">
                        <input type="text" id="loads" name="loads" placeholder="loads">
                    </form>
                </div>


                <div class="Button-add">
                    <button id="add-button">Add</button>
                </div>          
                
            </div> 
        </div>
    </div>

</body>
<script src="workoutList.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</html>
